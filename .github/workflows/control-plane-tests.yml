name: Control plane tests

'on':
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Python 3.12 tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --no-cache-dir \
            -r control-plane/requirements.txt \
            pytest==8.3.5 \
            setuptools==68.1.2 \
            wheel==0.45.1
          python -m pip check

      - name: Run control-plane tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: control-plane/src
        run: |
          test_python="$(command -v python)"
          test -x /usr/bin/python3
          PATH="/usr/bin:$PATH" "$test_python" -m pytest -q -rs -p no:cacheprovider \
            control-plane/tests
